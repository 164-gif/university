<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>University AI — локальный поиск</title>
  <style>
    body{font:16px/1.5 system-ui,sans-serif;max-width:850px;margin:3rem auto;padding:0 1rem;color:#17202a}
    h1{font-size:1.7rem}form{display:flex;gap:.5rem}input{flex:1;padding:.75rem;font:inherit}button{padding:.7rem 1rem;font:inherit}
    li{margin:1rem 0;padding:1rem;border:1px solid #ccd3da;border-radius:.5rem}small{color:#586575}#status{min-height:1.5em}
  </style>
</head>
<body>
  <h1>Локальный поиск по материалам университета</h1>
  <p>Модель и индекс загружаются с этого же компьютера. Внешние API не используются.</p>
  <form id="search"><input id="query" required placeholder="Например: как найти производную?" autocomplete="off"><button>Найти</button></form>
  <p id="status" role="status">Подготовка локальной модели…</p>
  <ol id="results"></ol>
  <script type="module" src="./ai-search.js"></script>
</body>
</html>
