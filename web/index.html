<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f8fb" />
  <title>University Notes</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="enhancements.css" />
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn mobile-only" aria-label="Открыть навигацию">☰</button>
    <a class="brand" href="#/">University Notes</a>
    <div class="top-actions">
      <button id="searchBtn" class="icon-btn" aria-label="Поиск">⌕</button>
      <button id="themeBtn" class="icon-btn" aria-label="Сменить тему">◐</button>
    </div>
  </header>

  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Навигация">
      <div class="sidebar-head">
        <div class="sidebar-title">Предметы</div>
        <button id="closeSidebar" class="icon-btn mobile-only" aria-label="Закрыть">×</button>
      </div>
      <nav id="navigation" class="navigation"></nav>
    </aside>

    <main class="main">
      <div id="breadcrumbs" class="breadcrumbs"></div>
      <div class="content-grid">
        <article id="content" class="article" aria-live="polite"></article>
        <aside id="toc" class="toc" aria-label="Оглавление"></aside>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    <span class="footer-label">Статистика посещений</span>
    <div class="visitor-counters">
      <img class="visitor-counter" src="https://visitor-badge.one9x.com/badge?page_id=university-164-gif-total&namespace=univ164&left_text=%D0%92%D1%81%D0%B5%D0%B3%D0%BE&left_color=%235b6472&right_color=%234665e5" alt="Всего посещений" loading="eager" />
      <img class="visitor-counter" src="https://visitor-badge.one9x.com/badge?page_id=university-164-gif-unique&namespace=univ164&unique=true&timeframe=86400&left_text=%D0%A3%D0%BD%D0%B8%D0%BA%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D0%B7%D0%B0%2024%D1%87&left_color=%235b6472&right_color=%234665e5" alt="Уникальные посетители за 24 часа" loading="eager" />
    </div>
  </footer>

  <div id="overlay" class="overlay"></div>

  <dialog id="searchDialog" class="search-dialog">
    <form method="dialog" class="search-head">
      <input id="searchInput" type="search" placeholder="Поиск по темам, предметам и тексту…" autocomplete="off" autofocus />
      <button class="icon-btn" value="cancel" aria-label="Закрыть">×</button>
    </form>
    <div id="searchResults" class="search-results"></div>
    <div class="search-hint">↑↓ — выбрать · Enter — открыть · Esc — закрыть · / или Ctrl+K — поиск</div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script defer>window.__mermaid = window.mermaid;</script>
  <script defer src="geometry-quiz.js?v=20261018-2"></script>
  <script defer src="geometry-quiz-bootstrap.js?v=20261018-2"></script>
  <script defer src="ai-test-config.js"></script>
  <script defer src="app.js"></script>
  <script defer src="numbering.js"></script>
  <script defer src="subject-labels.js"></script>
  <script defer src="navigation-search.js"></script>
  <script defer>
    (() => {
      const normalizeCohortHash = () => {
        const prefix = "#/cohort/";
        if (location.hash.startsWith(prefix) && !location.hash.startsWith(prefix + "/")) {
          const id = location.hash.slice(prefix.length);
          if (id) location.replace(prefix + "/" + id);
        }
      };
      document.addEventListener("click", (event) => {
        const link = event.target.closest('a[href^="#/cohort/"]');
        if (!link) return;
        const href = link.getAttribute("href");
        if (!href || href.startsWith("#/cohort//")) return;
        event.preventDefault();
        location.hash = "#/cohort//" + href.slice("#/cohort/".length);
      });
      addEventListener("hashchange", normalizeCohortHash);
      normalizeCohortHash();
    })();

    (() => {
      const content = document.getElementById("content");
      if (!content) return;

      const promptText = "Прочитай полностью инструкцию University Notes по этой прямой текстовой ссылке, выполни указанный в ней порядок ознакомления и подготовься работать с материалами: https://164-gif.github.io/university/AI_ENTRY.txt";
      const testPrompt = "Пройди полный тест доступа University Notes V2. Обязательно заново открой ссылку ниже и не используй старый список из истории чата. Актуальный список должен содержать только короткие ASCII URL вида /ai/f/<id>.txt. Если видишь /ai/source/, кириллицу, %D0 или длинные имена файлов — это STALE_TEST, перечитай V2. Затем реально открой каждый файл, собери TEST_FRAGMENT строго по порядку и верни FILES_OK и KEY. Если хотя бы один файл недоступен, верни TEST_FAILED: https://164-gif.github.io/university/AI_ACCESS_TEST.txt?v=2";

      const copyText = async (text) => {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const area = document.createElement("textarea");
          area.value = text;
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();
          document.execCommand("copy");
          area.remove();
        }
      };

      const makeCopyButton = (label, meta, text) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "subject-card";
        button.style.cursor = "pointer";
        button.style.textAlign = "left";
        const idle = () => button.innerHTML = `<div class="subject-card-title">${label}</div><div class="subject-card-meta">${meta}</div>`;
        idle();
        button.addEventListener("click", async () => {
          await copyText(text);
          button.innerHTML = '<div class="subject-card-title">Скопировано ✓</div><div class="subject-card-meta">Отправьте текст выбранному AI</div>';
          setTimeout(idle, 1800);
        });
        return button;
      };

      const enhanceUserAiPage = () => {
        const hash = location.hash || "#/";
        if (!hash.startsWith("#/doc/AI_FOR_USERS.md")) return;
        if (content.querySelector(".ai-provider-buttons")) return;
        const mobileHeading = [...content.querySelectorAll("h2")].find((h) => h.textContent.trim() === "Обычные AI на телефоне");
        if (!mobileHeading) return;

        const wrap = document.createElement("div");
        wrap.className = "subject-grid ai-provider-buttons";
        wrap.style.margin = "16px 0 24px";
        wrap.append(
          makeCopyButton("Qwen — копировать промпт", "Готовый запрос для обычного мобильного приложения", promptText),
          makeCopyButton("Claude — копировать промпт", "Готовый запрос для обычного мобильного приложения", promptText),
          makeCopyButton("GLM (Z.ai) — копировать промпт", "Готовый запрос для обычного мобильного приложения", promptText)
        );
        mobileHeading.insertAdjacentElement("afterend", wrap);
      };

      const enhanceAiTestPage = () => {
        const hash = location.hash || "#/";
        if (!hash.startsWith("#/doc/AI_TEST.md")) return;
        if (content.querySelector(".ai-test-controls")) return;

        const runHeading = [...content.querySelectorAll("h2")].find((h) => h.textContent.trim() === "Как запустить");
        if (runHeading) {
          const controls = document.createElement("div");
          controls.className = "subject-grid ai-test-controls";
          controls.style.margin = "16px 0 24px";
          controls.append(makeCopyButton("Копировать полный тест AI V2", "Короткие ASCII-ссылки и защита от старого кэша", testPrompt));
          runHeading.insertAdjacentElement("afterend", controls);
        }

        const verifyHeading = [...content.querySelectorAll("h2")].find((h) => h.textContent.trim() === "Проверка результата");
        if (!verifyHeading) return;

        const box = document.createElement("div");
        box.className = "ai-test-validator";
        box.style.margin = "14px 0 22px";
        box.innerHTML = `
          <textarea class="ai-test-key-input" rows="4" style="width:100%;box-sizing:border-box" placeholder="Вставьте ответ AI или строку KEY=UNIV-FULL-..."></textarea>
          <button type="button" class="subject-card ai-test-check" style="display:block;width:100%;margin-top:10px;cursor:pointer;text-align:left">
            <div class="subject-card-title">Проверить ключ</div>
            <div class="subject-card-meta">Сравнить с текущей сборкой сайта</div>
          </button>
          <div class="ai-test-result" style="margin-top:12px"></div>`;
        verifyHeading.insertAdjacentElement("afterend", box);

        const input = box.querySelector(".ai-test-key-input");
        const result = box.querySelector(".ai-test-result");
        box.querySelector(".ai-test-check").addEventListener("click", () => {
          const cfg = window.__AI_TEST__;
          if (!cfg || !cfg.expectedKey) {
            result.textContent = "Эталон теста ещё не загружен. Обновите страницу после завершения деплоя.";
            return;
          }
          const raw = input.value.trim();
          if (/\/ai\/source\/|%D0|URL_TOO_LONG|STALE_TEST/i.test(raw)) {
            result.innerHTML = '<strong>Использована старая версия теста.</strong> Скопируйте V2 заново и запустите её в новом чате.';
            return;
          }
          const match = raw.match(/(?:^|\n)KEY=(UNIV-FULL-[A-F0-9]+)/i) || raw.match(/(UNIV-FULL-[A-F0-9]+)/i);
          const key = match ? match[1].toUpperCase() : raw.toUpperCase();
          if (key === cfg.expectedKey.toUpperCase()) {
            result.innerHTML = `<strong>Полный доступ подтверждён.</strong> Ключ совпал. Текущая сборка содержит ${cfg.total} проверяемых текстовых файлов.`;
          } else {
            result.innerHTML = `<strong>Ключ неверный.</strong> AI не прочитал все файлы, нарушил порядок или использует ключ от другой версии сайта. В текущей сборке проверяется ${cfg.total} файлов.`;
          }
        });
      };

      const injectAiEntry = () => {
        const hash = location.hash || "#/";
        if (hash !== "#/" && hash !== "") return;
        const grid = content.querySelector(":scope > .subject-grid");
        if (!grid || content.querySelector(".ai-entry-section")) return;
        const section = document.createElement("section");
        section.className = "ai-entry-section";
        section.innerHTML = `
          <h2>Работа с AI</h2>
          <p>Подключение AI к материалам и отдельная проверка, действительно ли модель умеет читать все опубликованные файлы.</p>
          <div class="subject-grid">
            <a class="subject-card" href="#/doc/AI_FOR_USERS.md">
              <div class="subject-card-title">Открыть раздел «Работа с AI»</div>
              <div class="subject-card-meta">Qwen · Claude · GLM/Z.ai · ChatGPT · агенты</div>
            </a>
            <a class="subject-card" href="#/doc/AI_TEST.md">
              <div class="subject-card-title">Проверить полный доступ AI</div>
              <div class="subject-card-meta">V2 · короткие ссылки · контрольные фрагменты · итоговый ключ</div>
            </a>
          </div>`;
        grid.insertAdjacentElement("afterend", section);
      };

      const enhance = () => {
        injectAiEntry();
        enhanceUserAiPage();
        enhanceAiTestPage();
      };

      new MutationObserver(enhance).observe(content, { childList: true, subtree: false });
      addEventListener("hashchange", () => setTimeout(enhance, 0));
      enhance();
    })();
  </script>
</body>
</html>
