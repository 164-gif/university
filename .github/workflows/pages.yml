name: Deploy University Notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Check website JavaScript syntax
        run: node --check web/app.js

      - name: Build static site
        env:
          UNIVERSITY_REQUIRE_GIT_DATES: '1'
        run: python3 web/build_site.py

      - name: Verify formulas and edit dates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('_site/content.json').read_text(encoding='utf-8'))
          assert manifest.get('version', 0) >= 10
          assert manifest.get('buildId')
          docs = manifest['docs']
          assert all(doc.get('lastModified') for doc in docs), 'Missing Git timestamps'
          for path in [
              'subjects/analytical_geometry/exam/Подготовка к коллоквиуму полная.md',
              'subjects/analytical_geometry/notes/05 - Скалярное произведение.md',
              'subjects/physics/README.md',
          ]:
              match = next((d for d in docs if d['path'] == path), None)
              assert match and match.get('lastModified'), f'Unicode filename date unavailable: {path}'
          target = next(d for d in docs if d['path'].endswith('exam/Подготовка к коллоквиуму полная.md') and d['subject'] == 'analytical_geometry')
          formula = r'\vec a\cdot\vec b=|\vec a|\cdot|\vec b|\cdot\cos(\vec a\wedge\vec b)'
          assert formula in target['content'], 'Scalar product is missing'
          assert '\n$\n' not in target['content'], 'Broken multiline math delimiter remains'
          assert 'src="app.js?v=' in Path('_site/index.html').read_text(encoding='utf-8')
          print('Math source, Git dates and versioned frontend: OK')
          PY

      - name: AI cache fingerprints
        id: ai_plan
        continue-on-error: true
        run: python3 -m ai.publish_search plan

      - name: Restore verified AI bundle cache
        id: ai_cache
        if: steps.ai_plan.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ai-search-cache/bundle
          key: ai-bundle-v3-${{ runner.os }}-${{ steps.ai_plan.outputs.vector_key }}-${{ steps.ai_plan.outputs.code_key }}-${{ steps.ai_plan.outputs.corpus_key }}
          restore-keys: |
            ai-bundle-v3-${{ runner.os }}-${{ steps.ai_plan.outputs.vector_key }}-${{ steps.ai_plan.outputs.code_key }}-
            ai-bundle-v3-${{ runner.os }}-${{ steps.ai_plan.outputs.vector_key }}-

      - name: Validate and reuse AI bundle
        id: ai_restore
        if: steps.ai_plan.outcome == 'success'
        continue-on-error: true
        run: python3 -m ai.publish_search restore

      - name: Set up compatible Python for AI
        id: ai_python
        if: steps.ai_plan.outcome == 'success' && steps.ai_restore.outputs.ready != 'true'
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/browser-runtime/requirements.txt

      - name: Set up Node and npm cache
        id: ai_node
        if: steps.ai_plan.outcome == 'success' && steps.ai_restore.outputs.ready != 'true'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai/browser-runtime/package-lock.json

      - name: Build and validate optional AI index
        id: ai_build
        if: steps.ai_plan.outcome == 'success' && steps.ai_restore.outputs.ready != 'true' && steps.ai_python.outcome == 'success' && steps.ai_node.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          AI_SMOKE_REQUIRED: ${{ steps.ai_restore.outputs.smoke_required }}
        run: |
          set -euo pipefail
          npm ci --prefix ai/browser-runtime --no-audit --no-fund
          python -m pip install --only-binary=:all: --disable-pip-version-check --retries 2 -r ai/browser-runtime/requirements.txt
          python -m ai.publish_search build
          node --test web/tests/ai-search.test.mjs
          if [ "$AI_SMOKE_REQUIRED" != "false" ]; then
            npm install --prefix ai/browser-runtime --no-save --package-lock=false --no-audit --no-fund playwright-core@1.51.1
            python -m http.server 8123 --bind 127.0.0.1 --directory _site &
            server=$!
            trap 'kill "$server" 2>/dev/null || true' EXIT
            for i in {1..20}; do curl -fsS http://127.0.0.1:8123/ai-search.html >/dev/null && break; sleep 1; done
            node ai/browser-runtime/smoke.mjs
          else
            echo "AI implementation unchanged; browser smoke test reused from verified cache."
          fi
          python -m ai.publish_search save-cache

      - name: Save successful AI bundle
        if: steps.ai_build.outcome == 'success' && steps.ai_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ai-search-cache/bundle
          key: ${{ steps.ai_cache.outputs.cache-primary-key }}

      - name: Isolate optional AI failures
        if: always()
        env:
          AI_READY: ${{ steps.ai_restore.outputs.ready }}
          AI_BUILD_OUTCOME: ${{ steps.ai_build.outcome }}
        run: |
          if [ "$AI_READY" = "true" ] || [ "$AI_BUILD_OUTCOME" = "success" ]; then
            echo "AI beta bundle is ready."
          else
            rm -rf _site/ai-search-assets
            echo "::warning::AI beta unavailable for this build; publishing regular website without unverified or stale AI assets."
          fi

      - name: Include University AI v0.3
        env:
          GH_TOKEN: ${{ github.token }}
          V03_BUNDLE_SHA256: 156e2737cda4bff85d82e6a2b61b451c24c42a4ca82e6b600758784d763bea80
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/university-ai-v03-browser.zip"
          gh release download university-ai-v0.3 --repo "$GITHUB_REPOSITORY" \
            --pattern university-ai-v03-browser.zip --output "$bundle"
          printf '%s  %s\n' "$V03_BUNDLE_SHA256" "$bundle" | sha256sum --check
          python3 -m zipfile -e "$bundle" _site/ai-v03

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
