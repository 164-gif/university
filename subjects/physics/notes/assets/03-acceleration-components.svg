<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
<title id="title">Разложение ускорения при криволинейном движении</title>
<desc id="desc">В точке A на траектории касательная скорость и тангенциальное ускорение направлены вдоль касательной, нормальное ускорение направлено к центру кривизны O. Полное ускорение есть сумма составляющих.</desc>
