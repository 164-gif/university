<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-labelledby="title desc"><title id="title">Третий закон Ньютона: силы взаимодействия двух точек</title><desc id="desc">В точке 1 слева направо действует сила F12. В точке 2 справа налево действует сила F21. Стрелки направлены навстречу друг другу вдоль прямой, соединяющей точки, как в тетради.</desc><rect width="940" height="420" fill="#fafcff"/><path d="M155 180H785" stroke="#8794aa" stroke-width="3" stroke-dasharray="16 10"/><circle cx="165" cy="180" r="11" fill="#203955"/><circle cx="775" cy="180" r="11" fill="#203955"/><path d="M165 180H345M323 165L345 180L323 195" fill="none" stroke="#1264a3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M775 180H595M617 165L595 180L617 195" fill="none" stroke="#bb543a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g font-family="sans-serif" font-size="31" fill="#162b45"><text x="148" y="225">1</text><text x="764" y="225">2</text><text x="230" y="142" fill="#1264a3">F₁₂</text><text x="650" y="142" fill="#bb543a">F₂₁</text><text x="290" y="339">F₁₂ = −F₂₁</text></g></svg>