<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Силы взаимодействия двух тел</title><desc id="desc">Две материальные точки 1 и 2 на одной горизонтальной прямой. На точку 1 действует сила F21 влево, на точку 2 действует сила F12 вправо. Силы противоположны и равны по модулю.</desc><rect width="900" height="360" fill="#fafcff"/><path d="M200 180H700" stroke="#a0acc0" stroke-width="3" stroke-dasharray="13 9"/><g fill="#253d61"><circle cx="260" cy="180" r="15"/><circle cx="640" cy="180" r="15"/></g><path d="M260 180H90M110 165L90 180L110 195" stroke="#b4533a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M640 180H810M790 165L810 180L790 195" stroke="#235fba" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><g font-family="sans-serif" font-size="30" fill="#1f3550"><text x="243" y="224">1</text><text x="624" y="224">2</text><text x="112" y="151" fill="#b4533a">F₂₁</text><text x="716" y="151" fill="#235fba">F₁₂</text><text x="232" y="308">F₁₂ = −F₂₁</text></g></svg>