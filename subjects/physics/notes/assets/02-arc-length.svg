<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Длина малого участка дуги</title><desc id="desc">От центра O проведены два радиуса R к концам малого участка дуги dS. Между радиусами угол dφ. Соотношение dS=R dφ.</desc><rect width="800" height="460" fill="#fbfdff"/><path d="M140 390L610 270M140 390L540 107" stroke="#344563" stroke-width="4" fill="none"/><path d="M610 270A485 485 0 0 0 540 107" stroke="#1d70b8" stroke-width="7" fill="none"/><path d="M238 365A105 105 0 0 0 226 329" stroke="#bf6641" stroke-width="4" fill="none"/><circle cx="140" cy="390" r="8" fill="#344563"/><g font-family="sans-serif" fill="#243954" font-size="30"><text x="112" y="427">O</text><text x="360" y="356">R</text><text x="326" y="242">R</text><text x="630" y="180" fill="#1d70b8">dS</text><text x="247" y="333" fill="#bf6641">dφ</text><text x="380" y="432">dS = R dφ</text></g></svg>