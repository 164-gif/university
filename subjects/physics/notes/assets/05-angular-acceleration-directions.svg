<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
<title id="title">Угловое ускорение при разгоне и торможении</title>
<desc id="desc">Две параллельные схемы вращения: при разгоне векторы угловой скорости и ускорения вдоль оси сонаправлены; при торможении они противоположны.</desc><rect width="940" height="500" fill="#fafcff"/>
