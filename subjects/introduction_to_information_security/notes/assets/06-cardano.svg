<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 410" role="img" aria-labelledby="title desc">
<title id="title">Варианты решётки Кардано</title>
<desc id="desc">Вариант 1: трафарет с отверстиями; Запись через прорези, затем заполнение пустот; Вариант 2: поворотная решётка; Поворот на 90° и запись следующей части</desc>
<rect width="380" height="410" rx="16" fill="#f8fafc"/>
<text x="190" y="27" text-anchor="middle" fill="#0f172a" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700">Варианты решётки Кардано</text>
<rect x="18" y="75" width="344" height="71" rx="11" fill="#dff2fd" stroke="#0284c7" stroke-width="1.6"/>
<text x="190" y="105" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">Вариант 1: трафарет с</text>
<text x="190" y="128" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">отверстиями</text>
<rect x="18" y="159" width="344" height="71" rx="11" fill="#eff6ff" stroke="#0284c7" stroke-width="1.6"/>
<text x="190" y="189" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">Запись через прорези, затем</text>
<text x="190" y="212" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">заполнение пустот</text>
<rect x="18" y="243" width="344" height="56" rx="11" fill="#dff2fd" stroke="#0284c7" stroke-width="1.6"/>
<text x="190" y="277" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">Вариант 2: поворотная решётка</text>
<rect x="18" y="312" width="344" height="71" rx="11" fill="#eff6ff" stroke="#0284c7" stroke-width="1.6"/>
<text x="190" y="342" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">Поворот на 90° и запись</text>
<text x="190" y="365" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">следующей части</text>
</svg>