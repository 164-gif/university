<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 454" role="img" aria-labelledby="title desc">
<title id="title">Варианты решётки Кардано</title><desc id="desc">Вариант 1: трафарет с отверстиями; Запись в прорези, заполнение пустот; Вариант 2: поворотная решётка; Поворот на 90°, запись следующей части</desc><rect width="100%" height="100%" fill="#f8fafc" rx="20"/>
<text x="310" y="48" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700">Варианты решётки Кардано</text>
<rect x="36" y="90" width="548" height="64" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
<text x="310" y="130" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600">Вариант 1: трафарет с отверстиями</text>
<rect x="36" y="170" width="548" height="64" rx="14" fill="#eff6ff" stroke="#0284c7" stroke-width="1.6"/>
<text x="310" y="210" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600">Запись в прорези, заполнение пустот</text>
<rect x="36" y="250" width="548" height="64" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
<text x="310" y="290" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600">Вариант 2: поворотная решётка</text>
<rect x="36" y="330" width="548" height="78" rx="14" fill="#eff6ff" stroke="#0284c7" stroke-width="1.6"/>
<text x="310" y="363" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600">Поворот на 90°, запись следующей</text>
<text x="310" y="391" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600">части</text>
</svg>