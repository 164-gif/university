<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#ffffff"/>
  <style>
    .t{font-family:Arial,sans-serif;fill:#111827}.h{font-size:34px;font-weight:700}.b{font-size:24px;font-weight:700}.s{font-size:20px}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.main{fill:#eef2ff;stroke:#4f46e5;stroke-width:3}.line{stroke:#64748b;stroke-width:3;fill:none}
  </style>
  <rect class="main" x="390" y="45" rx="20" ry="20" width="420" height="90"/>
  <text class="t h" x="600" y="100" text-anchor="middle">Персональные данные</text>
  <path class="line" d="M600 135V190M150 190H1050M150 190V230M450 190V230M750 190V230M1050 190V230"/>
  <rect class="box" x="35" y="230" rx="18" width="230" height="330"/>
  <text class="t b" x="150" y="275" text-anchor="middle">Общие</text>
  <text class="t s" x="60" y="325">• ФИО</text>
  <text class="t s" x="60" y="365">• год рождения</text>
  <text class="t s" x="60" y="405">• номер паспорта</text>
  <text class="t s" x="60" y="445">• и др.</text>
  <rect class="box" x="335" y="230" rx="18" width="230" height="330"/>
  <text class="t b" x="450" y="275" text-anchor="middle">Специальные</text>
  <text class="t s" x="360" y="325">• национальность</text>
  <text class="t s" x="360" y="365">• расовая</text>
  <text class="t s" x="380" y="395">принадлежность</text>
  <text class="t s" x="360" y="435">• религия</text>
  <text class="t s" x="360" y="475">• состояние здоровья</text>
  <rect class="box" x="635" y="230" rx="18" width="230" height="330"/>
  <text class="t b" x="750" y="275" text-anchor="middle">Биометрические</text>
  <text class="t s" x="660" y="325">• фотография</text>
  <text class="t s" x="660" y="365">• отпечатки пальцев</text>
  <text class="t s" x="660" y="405">• иные признаки,</text>
  <text class="t s" x="680" y="435">используемые для</text>
  <text class="t s" x="680" y="465">идентификации</text>
  <rect class="box" x="935" y="230" rx="18" width="230" height="330"/>
  <text class="t b" x="1050" y="275" text-anchor="middle">Иные</text>
  <text class="t s" x="960" y="325">Прочие сведения,</text>
  <text class="t s" x="960" y="355">относящиеся к</text>
  <text class="t s" x="960" y="385">субъекту ПД.</text>
  <text class="t s" x="600" y="630" text-anchor="middle">Схема восстановлена по структуре рукописного конспекта.</text>
  <text class="t s" x="600" y="665" text-anchor="middle">Неразборчивые примеры из исходника не добавлялись.</text>
</svg>