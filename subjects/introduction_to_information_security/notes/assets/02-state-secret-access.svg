<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390">
<style>
text{font-family:Arial,sans-serif;fill:currentColor}
.box{fill:none;stroke:currentColor;stroke-width:3;rx:14}
.title{font-size:28px;font-weight:700}
.label{font-size:24px}
.small{font-size:19px}
</style>
<text class="title" x="450" y="45" text-anchor="middle">Формы допуска — как записано в конспекте</text>
<rect class="box" x="60" y="95" width="240" height="120"/>
<text class="label" x="180" y="140" text-anchor="middle">Секретно</text>
<text class="label" x="180" y="180" text-anchor="middle">форма №3</text>
<rect class="box" x="330" y="95" width="240" height="120"/>
<text class="label" x="450" y="140" text-anchor="middle">Совершенно</text>
<text class="label" x="450" y="172" text-anchor="middle">секретно — №2</text>
<rect class="box" x="600" y="95" width="240" height="120"/>
<text class="label" x="720" y="140" text-anchor="middle">Особой важности</text>
<text class="label" x="720" y="180" text-anchor="middle">№1</text>
<text class="small" x="450" y="285" text-anchor="middle">Схема по записи на 1000037487</text>
<text class="small" x="450" y="320" text-anchor="middle">Формулировки отдельно не сверялись с законодательством</text>
</svg>