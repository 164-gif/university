<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 227" role="img" aria-labelledby="title desc">
<title id="title">Шифрование и кодирование</title>
<desc id="desc">Шифрование — скрытие смысла; Кодирование — изменение формы</desc>
<rect width="380" height="227" rx="16" fill="#f8fafc"/>
<text x="190" y="27" text-anchor="middle" fill="#0f172a" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700">Шифрование и кодирование</text>
<rect x="18" y="75" width="344" height="56" rx="11" fill="#dff2fd" stroke="#0284c7" stroke-width="1.6"/>
<text x="190" y="109" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">Шифрование — скрытие смысла</text>
<rect x="18" y="144" width="344" height="56" rx="11" fill="#eff6ff" stroke="#0284c7" stroke-width="1.6"/>
<text x="190" y="178" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">Кодирование — изменение формы</text>
</svg>