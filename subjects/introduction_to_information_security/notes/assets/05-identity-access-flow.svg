<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/></marker></defs>
  <style>
    .t{font-family:Arial,sans-serif;fill:#111827}.h{font-size:31px;font-weight:700}.b{font-size:25px;font-weight:700}.s{font-size:20px}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.arrow{stroke:#4f46e5;stroke-width:5;fill:none;marker-end:url(#a)}
  </style>
  <text class="t h" x="600" y="55" text-anchor="middle">Последовательность предоставления доступа</text>
  <rect class="box" x="55" y="120" rx="20" width="290" height="245"/>
  <text class="t b" x="200" y="170" text-anchor="middle">1. Идентификация</text>
  <text class="t s" x="85" y="220">Определение, какой</text>
  <text class="t s" x="85" y="250">пользователь обращается</text>
  <text class="t s" x="85" y="280">к информационной системе.</text>
  <rect class="box" x="455" y="120" rx="20" width="290" height="245"/>
  <text class="t b" x="600" y="170" text-anchor="middle">2. Аутентификация</text>
  <text class="t s" x="485" y="220">Подтверждение личности</text>
  <text class="t s" x="485" y="250">пользователя:</text>
  <text class="t s" x="485" y="280">«это действительно он».</text>
  <rect class="box" x="855" y="120" rx="20" width="290" height="245"/>
  <text class="t b" x="1000" y="170" text-anchor="middle">3. Авторизация</text>
  <text class="t s" x="885" y="220">Наделение правами,</text>
  <text class="t s" x="885" y="250">которыми пользователь</text>
  <text class="t s" x="885" y="280">может пользоваться</text>
  <text class="t s" x="885" y="310">в системе.</text>
  <path class="arrow" d="M345 242H445"/><path class="arrow" d="M745 242H845"/>
  <text class="t s" x="600" y="430" text-anchor="middle">Три процедуры записаны в исходном конспекте как последовательные этапы работы пользователя с системой.</text>
</svg>