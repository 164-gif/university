<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" role="img" aria-labelledby="title desc">
<title id="title">Направления информационной безопасности</title><desc id="desc">Организационно-правовая защита; Инженерно-техническая защита; Программно-аппаратная защита; Криптографическая защита информации</desc><rect width="100%" height="100%" fill="#f8fafc" rx="20"/>
<text x="310" y="48" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700">Направления информационной безопасности</text>
<rect x="36" y="90" width="548" height="64" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
<text x="310" y="130" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600">Организационно-правовая защита</text>
<rect x="36" y="170" width="548" height="64" rx="14" fill="#eff6ff" stroke="#0284c7" stroke-width="1.6"/>
<text x="310" y="210" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600">Инженерно-техническая защита</text>
<rect x="36" y="250" width="548" height="64" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
<text x="310" y="290" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600">Программно-аппаратная защита</text>
<rect x="36" y="330" width="548" height="64" rx="14" fill="#eff6ff" stroke="#0284c7" stroke-width="1.6"/>
<text x="310" y="370" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600">Криптографическая защита информации</text>
</svg>