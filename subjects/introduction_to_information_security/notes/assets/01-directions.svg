<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 403" role="img" aria-labelledby="title desc">
<title id="title">Направления информационной безопасности</title>
<desc id="desc">Организационно-правовая защита; Инженерно-техническая защита; Программно-аппаратная защита; Криптографическая защита информации</desc>
<rect width="380" height="403" rx="16" fill="#f8fafc"/>
<text x="190" y="27" text-anchor="middle" fill="#0f172a" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700">Направления информационной</text>
<text x="190" y="50" text-anchor="middle" fill="#0f172a" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700">безопасности</text>
<rect x="18" y="98" width="344" height="56" rx="11" fill="#dff2fd" stroke="#0284c7" stroke-width="1.6"/>
<text x="190" y="132" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">Организационно-правовая защита</text>
<rect x="18" y="167" width="344" height="56" rx="11" fill="#eff6ff" stroke="#0284c7" stroke-width="1.6"/>
<text x="190" y="201" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">Инженерно-техническая защита</text>
<rect x="18" y="236" width="344" height="56" rx="11" fill="#dff2fd" stroke="#0284c7" stroke-width="1.6"/>
<text x="190" y="270" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">Программно-аппаратная защита</text>
<rect x="18" y="305" width="344" height="71" rx="11" fill="#eff6ff" stroke="#0284c7" stroke-width="1.6"/>
<text x="190" y="335" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">Криптографическая защита</text>
<text x="190" y="358" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="600" fill="#0f172a">информации</text>
</svg>