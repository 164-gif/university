<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" role="img" aria-labelledby="title desc"><title id="title">Перенос и поворот системы координат</title><desc id="desc">Слева две параллельные системы координат с началом O и новым O штрих. Справа новая пара осей x штрих, y штрих повернута относительно x и y на угол альфа.</desc><rect width="980" height="480" fill="white"/><g font-family="sans-serif" fill="#263e57" font-size="26"><text x="70" y="43">Параллельный перенос</text><text x="550" y="43">Поворот осей</text></g><g stroke-width="3.5" fill="none" stroke="#334a63"><path d="M65 358H465m-20 -12 20 12 -20 12M145 435V110m-12 22 12 -22 12 22"/><path d="M250 270H485m-20 -12 20 12 -20 12M280 392V100m-12 22 12 -22 12 22"/><path d="M560 365H929m-20 -12 20 12 -20 12M700 460V85m-12 20 12 -20 12 20"/></g><g stroke="#a75630" stroke-width="5" fill="none" stroke-linecap="round"><path d="M700 365L894 189m-24 9 24 -9 -8 24M700 365L580 230m8 26 -8 -26 27 8"/></g><path d="M753 365A53 53 0 0 0 739 330" stroke="#784fa1" stroke-width="3" fill="none"/><g font-family="sans-serif" fill="#263e57" font-size="25"><text x="118" y="384">O</text><text x="285" y="287">O′</text><text x="455" y="392">x</text><text x="292" y="104">y′</text><text x="917" y="403">x</text><text x="714" y="100">y</text><text x="893" y="177">x′</text><text x="561" y="220">y′</text><text x="758" y="333">α</text></g></svg>