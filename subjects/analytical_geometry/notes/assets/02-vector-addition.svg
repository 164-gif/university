<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-labelledby="t d"><title id="t">Метод параллелограмма и метод треугольника</title><desc id="d">Слева векторы а и b имеют общее начало, их сумма — диагональ параллелограмма. Справа вектор b отложен от конца вектора а, а сумма соединяет начало а и конец b.</desc><rect width="940" height="470" fill="#fff"/><g font-family="sans-serif" font-size="26" fill="#1c3047"><text x="70" y="52">Метод параллелограмма</text><text x="545" y="52">Метод треугольника</text></g><g stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M115 355L315 355M299 345L315 355L299 365" stroke="#1d63af"/><path d="M115 355L205 175M186 185L205 175L205 199" stroke="#a4512e"/><path d="M205 175L405 175L315 355" stroke="#8c97aa" stroke-dasharray="8 8"/><path d="M115 355L405 175M381 179L405 175L395 197" stroke="#238660"/><path d="M540 355L705 355M689 345L705 355L689 365" stroke="#1d63af"/><path d="M705 355L815 180M796 190L815 180L817 202" stroke="#a4512e"/><path d="M540 355L815 180M791 186L815 180L807 202" stroke="#238660"/></g><g font-family="sans-serif" font-size="26" fill="#192e46"><text x="228" y="388">b</text><text x="136" y="240">a</text><text x="245" y="232">a + b</text><text x="618" y="389">a</text><text x="773" y="288">b</text><text x="567" y="255">a + b</text></g></svg>