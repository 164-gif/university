<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Прямые y=kx и y=kx+b</title><desc id="d">Слева прямая через начало координат образует угол фи с осью Ox и проходит через M(x,y). Справа прямая пересекает Oy в b и проходит через M(x,y).</desc><rect width="1000" height="470" fill="#fff"/><g stroke="#273c58" fill="none" stroke-width="3"><path d="M36 390H480m-18 -10 18 10 -18 10M108 450V35m-10 18 10 -18 10 18M525 390H970m-18 -10 18 10 -18 10M599 450V35m-10 18 10 -18 10 18"/></g><g fill="none" stroke-width="4" stroke="#246b9c"><path d="M50 425L446 75M535 435L930 125"/></g><g fill="none" stroke="#888" stroke-dasharray="9 8" stroke-width="2.5"><path d="M310 196V390M805 222V390M108 196H310M599 222H805"/></g><g fill="#174c83"><circle cx="310" cy="196" r="6"/><circle cx="805" cy="222" r="6"/></g><path d="M160 390A52 52 0 0 0 149 349M646 390A47 47 0 0 0 637 360" fill="none" stroke="#a35b35" stroke-width="3"/><g font-family="sans-serif" fill="#273c58" font-size="25"><text x="289" y="179">M(x,y)</text><text x="783" y="199">M(x,y)</text><text x="122" y="417">φ</text><text x="617" y="417">φ</text><text x="113" y="384">O</text><text x="602" y="410">O</text><text x="318" y="420">x</text><text x="813" y="419">x</text><text x="83" y="192">y</text><text x="565" y="217">b</text><text x="475" y="412">x</text><text x="969" y="412">x</text><text x="79" y="51">y</text><text x="568" y="51">y</text><text x="200" y="55">y = kx</text><text x="683" y="55">y = kx + b</text></g></svg>