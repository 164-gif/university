<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="title desc"><title id="title">Векторное произведение и площадь параллелограмма</title><desc id="desc">На плоскости параллелограмма построены векторы a, b. Вектор c направлен перпендикулярно плоскости, показана правая тройка.</desc><rect width="900" height="490" fill="white"/><path d="M145 353L540 382L720 185L325 159Z" fill="#e6eef7" stroke="#7f96b6" stroke-width="3"/><g fill="none" stroke-linecap="round" stroke-width="5"><path d="M145 353L540 382m-27 -17 27 17 -29 7" stroke="#1e6398"/><path d="M145 353L325 159m-23 14 23 -14 -8 28" stroke="#a95d36"/><path d="M145 353L145 60m-12 25 12 -25 12 25" stroke="#238461"/></g><g font-family="sans-serif" font-size="32" fill="#243956"><text x="545" y="417">a</text><text x="275" y="194">b</text><text x="162" y="74">c = a × b</text><text x="407" y="260">S</text></g></svg>