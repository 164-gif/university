<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 510" role="img" aria-labelledby="t d"><title id="t">Нормальная форма уравнения прямой</title><desc id="d">Прямая пересекает координатные оси. Из начала проведён перпендикуляр OP длины p, образующий угол фи с осью Ox.</desc><rect width="850" height="510" fill="#fff"/><g fill="none" stroke="#283f5a" stroke-width="4"><path d="M73 408H806m-20 -10 20 10 -20 10M190 470V52m-10 19 10 -19 10 19"/></g><path d="M164 92L639 473" fill="none" stroke="#246da1" stroke-width="5"/><path d="M190 408L382 269" fill="none" stroke="#a25737" stroke-width="4"/><path d="M366 282L380 302L400 287" fill="none" stroke="#a25737" stroke-width="3"/><circle cx="382" cy="269" r="6" fill="#a25737"/><path d="M256 408A66 66 0 0 0 245 368" fill="none" stroke="#a25737" stroke-width="3"/><g font-family="sans-serif" fill="#233d59" font-size="26"><text x="391" y="253">P</text><text x="270" y="340">p</text><text x="255" y="383">φ</text><text x="185" y="436">O</text><text x="776" y="447">x</text><text x="205" y="65">y</text><text x="104" y="106">p/sin φ</text><text x="570" y="435">p/cos φ</text></g></svg>