<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="t d"><title id="t">Проекция вектора AB на ось ℓ</title><desc id="d">Вектор AB расположен над горизонтальной осью ℓ и образует с осью угол φ. Перпендикуляры из A и B опускаются в A штрих и B штрих, отрезок A штрих B штрих — проекция.</desc><rect width="980" height="470" fill="#fff"/><g stroke-linejoin="round" stroke-linecap="round" fill="none"><path d="M70 340H915M892 327L915 340L892 353" stroke="#2c4a70" stroke-width="4"/><path d="M230 215L650 95M625 93L650 95L632 113" stroke="#196fa9" stroke-width="6"/><path d="M230 215V340M650 95V340" stroke="#8c94a1" stroke-width="3" stroke-dasharray="9 8"/><path d="M230 340H650M625 329L650 340L625 352" stroke="#b75832" stroke-width="5"/><path d="M310 215Q323 192 346 182" stroke="#7450b6" stroke-width="3"/></g><g font-family="sans-serif" fill="#203c58" font-size="30"><text x="190" y="209">A</text><text x="665" y="92">B</text><text x="206" y="379">A′</text><text x="639" y="379">B′</text><text x="917" y="369">ℓ</text><text x="335" y="202">φ</text><text x="445" y="385">A′B′</text></g></svg>