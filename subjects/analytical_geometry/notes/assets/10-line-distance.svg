<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-labelledby="t d"><title id="t">Расстояние от точки до прямой</title><desc id="d">Точка M(x0,y0) находится вне наклонной прямой l. От точки M проведён перпендикуляр до основания H на прямой, его длина равна d.</desc><rect width="820" height="460" fill="#fff"/><path d="M80 355L740 150" stroke="#2b688e" stroke-width="5"/><path d="M410 93L468 234" stroke="#a35f3a" stroke-width="4"/><path d="M468 234L485 228L493 246" stroke="#a35f3a" stroke-width="3" fill="none"/><circle cx="410" cy="93" r="7" fill="#1f5e93"/><circle cx="468" cy="234" r="6" fill="#a35f3a"/><g font-family="sans-serif" font-size="29" fill="#283e58"><text x="425" y="89">M(x₀,y₀)</text><text x="483" y="220">H</text><text x="449" y="150">d</text><text x="742" y="151">l</text></g></svg>