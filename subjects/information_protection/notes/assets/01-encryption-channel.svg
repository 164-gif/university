<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <rect width="1400" height="560" fill="#ffffff"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <style>
    .t{font-family:Arial,sans-serif;fill:#111827}.h{font-size:34px;font-weight:700}.b{font-size:22px;font-weight:700}.s{font-size:19px}.box{fill:#f8fafc;stroke:#475569;stroke-width:2}.accent{fill:#eef2ff;stroke:#4f46e5;stroke-width:3}.line{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#arrow)}.noise{stroke:#b45309;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}
  </style>
  <text class="t h" x="700" y="55" text-anchor="middle">Схема передачи защищённой информации</text>
  <rect class="box" x="45" y="190" rx="18" width="190" height="95"/><text class="t b" x="140" y="230" text-anchor="middle">Источник</text><text class="t s" x="140" y="258" text-anchor="middle">информации</text>
  <rect class="accent" x="285" y="175" rx="18" width="220" height="125"/><text class="t b" x="395" y="220" text-anchor="middle">Устройство</text><text class="t b" x="395" y="252" text-anchor="middle">шифрования</text>
  <rect class="box" x="555" y="190" rx="18" width="190" height="95"/><text class="t b" x="650" y="230" text-anchor="middle">Система</text><text class="t s" x="650" y="258" text-anchor="middle">передачи</text>
  <rect class="box" x="795" y="190" rx="18" width="150" height="95"/><text class="t b" x="870" y="245" text-anchor="middle">Среда</text>
  <rect class="box" x="995" y="190" rx="18" width="180" height="95"/><text class="t b" x="1085" y="230" text-anchor="middle">Система</text><text class="t s" x="1085" y="258" text-anchor="middle">приёма</text>
  <rect class="accent" x="1225" y="175" rx="18" width="140" height="125"/><text class="t b" x="1295" y="220" text-anchor="middle">Получение</text><text class="t s" x="1295" y="252" text-anchor="middle">информации</text>
  <path class="line" d="M235 238H275"/><path class="line" d="M505 238H545"/><path class="line" d="M745 238H785"/><path class="line" d="M945 238H985"/><path class="line" d="M1175 238H1215"/>
  <text class="t s" x="520" y="355" text-anchor="middle">На линии и устройства могут воздействовать помехи/посторонние воздействия</text>
  <path class="noise" d="M395 400V310"/><path class="noise" d="M650 400V300"/><path class="noise" d="M870 400V300"/><path class="noise" d="M1085 400V300"/>
  <text class="t s" x="700" y="500" text-anchor="middle">Схема перерисована по рукописному конспекту; неразборчивые подписи исходника не добавлялись.</text>
</svg>