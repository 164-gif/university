<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360"><style>text{font-family:Arial,sans-serif;fill:currentColor}.b{fill:none;stroke:currentColor;stroke-width:3;rx:16}.l{stroke:currentColor;stroke-width:3;fill:none}.t{font-size:28px;font-weight:700}.s{font-size:22px}.m{font-size:18px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="currentColor"/></marker></defs><text class="t" x="550" y="45" text-anchor="middle">Периоды инфекционного заболевания — по лекции</text><rect class="b" x="40" y="120" width="220" height="80"/><text class="s" x="150" y="168" text-anchor="middle">Инкубационный</text><path class="l" d="M260 160H330" marker-end="url(#a)"/><rect class="b" x="335" y="120" width="180" height="80"/><text class="s" x="425" y="168" text-anchor="middle">Начальный</text><path class="l" d="M515 160H585" marker-end="url(#a)"/><rect class="b" x="590" y="120" width="180" height="80"/><text class="s" x="680" y="168" text-anchor="middle">Разгар</text><path class="l" d="M770 160H840" marker-end="url(#a)"/><rect class="b" x="845" y="120" width="215" height="80"/><text class="s" x="952" y="168" text-anchor="middle">Исход</text><text class="m" x="550" y="265" text-anchor="middle">Выздоровление / осложнения / хронизация / летальный исход</text><text class="m" x="550" y="315" text-anchor="middle">Дополнительная иллюстрация, построенная строго по загруженному конспекту.</text></svg>