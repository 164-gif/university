<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360"><style>text{font-family:Arial,sans-serif;fill:currentColor}.b{fill:none;stroke:currentColor;stroke-width:3;rx:16}.l{stroke:currentColor;stroke-width:3;fill:none}.t{font-size:28px;font-weight:700}.s{font-size:22px}.m{font-size:18px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="currentColor"/></marker></defs><text class="t" x="550" y="45" text-anchor="middle">Фазы развития пожара — по лекции</text><rect class="b" x="70" y="120" width="250" height="90"/><text class="s" x="195" y="160" text-anchor="middle">Начальная фаза</text><text class="m" x="195" y="190" text-anchor="middle">рост зоны горения</text><path class="l" d="M320 165H420" marker-end="url(#a)"/><rect class="b" x="425" y="120" width="250" height="90"/><text class="s" x="550" y="155" text-anchor="middle">Объёмное развитие</text><text class="m" x="550" y="187" text-anchor="middle">максимальное развитие</text><path class="l" d="M675 165H775" marker-end="url(#a)"/><rect class="b" x="780" y="120" width="250" height="90"/><text class="s" x="905" y="160" text-anchor="middle">Затухание</text><text class="m" x="905" y="190" text-anchor="middle">ослабление и тление</text><text class="m" x="550" y="300" text-anchor="middle">Дополнительная иллюстрация, построенная строго по конспекту.</text></svg>