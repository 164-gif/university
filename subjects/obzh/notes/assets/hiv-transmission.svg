<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><style>text{font-family:Arial,sans-serif;fill:currentColor}.b{fill:none;stroke:currentColor;stroke-width:3;rx:16}.l{stroke:currentColor;stroke-width:3;fill:none}.t{font-size:28px;font-weight:700}.s{font-size:22px}.m{font-size:18px}</style><text class="t" x="550" y="45" text-anchor="middle">ВИЧ: основные пути передачи — по лекции</text><rect class="b" x="400" y="90" width="300" height="75"/><text class="s" x="550" y="135" text-anchor="middle">ВИЧ</text><path class="l" d="M550 165V225M550 225H180V275M550 225V275M550 225H920V275"/><rect class="b" x="50" y="275" width="260" height="100"/><text class="s" x="180" y="315" text-anchor="middle">Половой путь</text><text class="m" x="180" y="345" text-anchor="middle">незащищённый контакт</text><rect class="b" x="420" y="275" width="260" height="100"/><text class="s" x="550" y="315" text-anchor="middle">Через кровь</text><text class="m" x="550" y="345" text-anchor="middle">нестерильный инструмент</text><rect class="b" x="790" y="275" width="260" height="100"/><text class="s" x="920" y="315" text-anchor="middle">Вертикальный путь</text><text class="m" x="920" y="345" text-anchor="middle">мать → ребёнок</text><text class="m" x="550" y="440" text-anchor="middle">В лекции отдельно подчёркивается, что обычные бытовые контакты не являются путём передачи.</text><text class="m" x="550" y="485" text-anchor="middle">Дополнительная иллюстрация, построенная по загруженному конспекту.</text></svg>