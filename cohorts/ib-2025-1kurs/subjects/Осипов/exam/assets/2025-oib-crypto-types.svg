<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720"><style>text{font-family:Arial,sans-serif;fill:#eee}.h{font-size:27px;font-weight:700}.t{font-size:22px}.b{font-weight:700}.bg{fill:#181818;stroke:#444;stroke-width:2}</style><rect x="5" y="5" width="1490" height="710" rx="20" class="bg"/><text x="35" y="55" class="h">Виды криптографии</text><text x="470" y="55" class="h">Описание</text><text x="1110" y="55" class="h">Примеры</text><line x1="20" y1="95" x2="1480" y2="95" stroke="#444"/><text x="35" y="147" class="t b">Симметричная криптография</text><text x="470" y="147" class="t">Один ключ для шифрования и расшифровки</text><text x="1110" y="147" class="t">AES, DES</text><line x1="20" y1="195" x2="1480" y2="195" stroke="#444"/><text x="35" y="247" class="t b">Асимметричная криптография</text><text x="470" y="247" class="t">Пара ключей: публичный и приватный</text><text x="1110" y="247" class="t">RSA, ECC</text><line x1="20" y1="295" x2="1480" y2="295" stroke="#444"/><text x="35" y="347" class="t b">Криптография с открытым ключом</text><text x="470" y="347" class="t">Использует открытые и закрытые ключи для обмена данными</text><text x="1110" y="347" class="t">RSA, ECC</text><line x1="20" y1="395" x2="1480" y2="395" stroke="#444"/><text x="35" y="447" class="t b">Г_hash-функции</text><text x="470" y="447" class="t">Создание дайджеста данных для проверки целостности</text><text x="1110" y="447" class="t">SHA-256, MD5</text><line x1="20" y1="495" x2="1480" y2="495" stroke="#444"/><text x="35" y="547" class="t b">Криптография с цифровой подписью</text><text x="470" y="547" class="t">Подтверждение происхождения и целостности сообщения</text><text x="1110" y="547" class="t">RSA, цифровые сертификаты</text><line x1="20" y1="595" x2="1480" y2="595" stroke="#444"/><text x="35" y="647" class="t b">Квантовая криптография (современная)</text><text x="470" y="647" class="t">Использует квантовые свойства для защиты данных</text><text x="1110" y="647" class="t">Пока — экспериментальный уровень</text></svg>